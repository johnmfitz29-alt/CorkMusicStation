<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cork Music Station: Updates</title>
<link rel="preload" href="/assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Atkinson"; src: url("/assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Atkinson"; src: url("/assets/fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  :root { --wine: #5e0f20; --wine-dark: #3f0914; --ivory: #fff8ec; --ink: #1d1416; --line: #6b5a5e; --soft: #f3e7d6; --green: #116b2f; --yellow: #ffd83d; }
  * { box-sizing: border-box; }
  html { font-size: 26px; }
  body { margin: 0; background: var(--ivory); color: var(--ink); font-family: "Atkinson", system-ui, sans-serif; line-height: 1.45; }
  #practice { background: var(--yellow); color: #000; font-weight: 700; text-align: center; padding: 12px 16px; }
  header { background: var(--wine-dark); color: #fff; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  header strong { font-size: 1.05rem; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 20px 64px; }
  main:focus { outline: none; }
  h1 { color: var(--wine); font-size: 1.5rem; line-height: 1.2; margin: 0 0 20px; }
  p { margin: 0 0 18px; }
  button { font: inherit; font-weight: 700; min-height: 84px; padding: 16px 24px; width: 100%; border-radius: 12px; border: 3px solid var(--wine-dark); background: var(--wine); color: #fff; cursor: pointer; }
  button:focus-visible { outline: 5px solid #000; outline-offset: 3px; }
  button.plain { background: #fff; color: var(--wine-dark); }
  button.go { background: var(--green); border-color: #0a4a20; }
  button.help { min-height: 60px; width: auto; background: #fff; color: var(--wine-dark); border-color: #fff; }
  button:disabled { background: #d9d0c6; color: #3a3234; border-color: var(--line); cursor: default; }
  .stack { display: grid; gap: 16px; }
  .back { margin-top: 32px; }
  .readback { background: var(--soft); border-left: 10px solid var(--wine); padding: 20px; font-size: 1.15rem; font-weight: 700; margin-bottom: 24px; }
  .entry { border-top: 2px solid var(--line); padding: 18px 0; }
  .entry p { margin-bottom: 10px; }
  .note { font-weight: 700; }
  h2 { color: var(--wine); font-size: 1.2rem; margin: 36px 0 8px; }
  label { display: block; font-weight: 700; margin-bottom: 20px; }
  input[type=date] { display: block; font: inherit; width: 100%; min-height: 84px; margin-top: 10px; padding: 12px; border: 3px solid var(--line); border-radius: 12px; background: #fff; color: inherit; }
  .picture { display: block; max-width: 100%; max-height: 60vh; height: auto; margin: 0 auto 20px; border: 2px solid var(--line); background: #fff; }
  .picture.small { max-height: 220px; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 16px; }
  input.text, select { display: block; font: inherit; width: 100%; min-height: 84px; margin: 10px 0 20px; padding: 12px; border: 3px solid var(--line); border-radius: 12px; background: #fff; color: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { display: grid; gap: 10px; padding: 10px; border: 3px solid var(--line); border-radius: 12px; background: #fff; }
  .card.chosen { border: 6px solid var(--green); }
  .thumb { display: block; width: 100%; height: 220px; object-fit: contain; background: var(--soft); }
  .when { display: block; font-weight: 400; }
  .pages { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .pages .picture { max-height: 280px; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="practice" hidden>Practice Mode. Nothing you do here counts.</div>
<header><strong>Cork Music Station</strong><button type="button" class="help" id="help">Get Help</button></header>
<main id="main" tabindex="-1"></main>
<script>/*APP*/</script>
</body>
</html>
